<!doctype html>
<!-- Imagens da marca para o site (gerar.sh fotografa esta página no Chrome headless):
     #og = imagem de compartilhamento 1200 × 630 (Titânio, símbolo e o nome em Manrope, proposta W1 do Manual; o logotipo ainda está a decidir);
     #icone = ícone do app em Titânio (apple-touch-icon e manifest); #fav = favicon 32 px em PNG. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Manrope";src:url(../../assets/fontes/manrope.woff2) format("woff2");font-weight:200 800}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
.og{width:1200px;height:630px;box-sizing:border-box;background:radial-gradient(70% 90% at 22% 50%,rgba(169,155,242,.10),transparent 70%),#131315;color:#ebebee;
  display:flex;align-items:center;gap:56px;padding:0 110px;font-family:Manrope,sans-serif}
.og svg{width:330px;height:330px;flex:none}
.og .nome{font-weight:650;font-size:118px;line-height:1;letter-spacing:-.035em}
.og .dom{font-weight:500;font-size:28px;color:#a3a5ac;margin-top:22px;letter-spacing:.01em}
.og .rot{font-weight:600;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#7d8088;margin-top:30px}
.og .rot b{color:#a99bf2;font-weight:600}
.ic{width:100%;height:100%}
</style></head><body>
<script src="simbolo.js"></script>
<script>
const k=location.hash.slice(1);
if(k==="og") document.body.innerHTML=`<div class="og"><svg viewBox="-4 -4 108 108">${brain("po",{on:"#8b8e96",of:"#a99bf2"})}</svg><div><div class="nome">Offnets</div><div class="dom">offnets.org</div><div class="rot">on-net <b>→ off-net</b></div></div></div>`;
if(k==="icone") document.body.innerHTML=`<div class="ic">${appIcon("ti")}</div>`;
if(k==="fav") document.body.innerHTML=`<svg viewBox="2 -1 96 96" width="512" height="512" style="color:#5a3fc0;display:block">${glyph()}</svg>`;
</script></body></html>
